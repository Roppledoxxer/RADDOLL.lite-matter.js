<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="IMG_0689.jpeg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Ragdoll Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    touch-action: none;
    background: #222;
  }
  canvas {
    display: block;
  }
  .button {
    position: absolute;
    background: #444;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-size: 16px;
    z-index: 10;
  }
  #spawnBat {
    top: 10px;
    left: 10px;
  }
  #spawnSword {
    top: 10px;
    right: 10px;
  }
  #spawnRagdoll {
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
  }
</style>
</head>
<body>

<button class="button" id="spawnBat">Spawn Bat</button>
<button class="button" id="spawnSword">Spawn Sword</button>
<button class="button" id="spawnRagdoll">Spawn Ragdoll</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Render, Runner, World, Bodies, Body, Composite, Composites, Constraint, Mouse, MouseConstraint } = Matter;

// create engine
const engine = Engine.create();
const world = engine.world;
engine.gravity.y = 1;

// create renderer
const render = Render.create({
    element: document.body,
    engine: engine,
    options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#222',
    }
});
Render.run(render);

// create runner
const runner = Runner.create();
Runner.run(runner, engine);

// boundaries
const thickness = 50000;
const width = window.innerWidth;
const height = window.innerHeight;

const floor = Bodies.rectangle(width/2, height + thickness/2, width, thickness, { isStatic: true });
const ceiling = Bodies.rectangle(width/2, -thickness/2, width, thickness, { isStatic: true });
const leftWall = Bodies.rectangle(-thickness/2, height/2, thickness, height, { isStatic: true });
const rightWall = Bodies.rectangle(width + thickness/2, height/2, thickness, height, { isStatic: true });

World.add(world, [floor, ceiling, leftWall, rightWall]);

// helper function to create ragdoll
function createRagdoll(x, y) {
    const head = Bodies.circle(x, y - 60, 20, { restitution: 0.4 });
    const torso = Bodies.rectangle(x, y, 30, 60, { restitution: 0.3 });
    const upperArmLeft = Bodies.rectangle(x - 25, y - 20, 15, 40, { restitution: 0.3 });
    const upperArmRight = Bodies.rectangle(x + 25, y - 20, 15, 40, { restitution: 0.3 });
    const lowerArmLeft = Bodies.rectangle(x - 25, y + 10, 15, 40, { restitution: 0.3 });
    const lowerArmRight = Bodies.rectangle(x + 25, y + 10, 15, 40, { restitution: 0.3 });
    const upperLegLeft = Bodies.rectangle(x - 10, y + 50, 15, 50, { restitution: 0.3 });
    const upperLegRight = Bodies.rectangle(x + 10, y + 50, 15, 50, { restitution: 0.3 });
    const lowerLegLeft = Bodies.rectangle(x - 10, y + 90, 15, 50, { restitution: 0.3 });
    const lowerLegRight = Bodies.rectangle(x + 10, y + 90, 15, 50, { restitution: 0.3 });

    const parts = [head, torso, upperArmLeft, upperArmRight, lowerArmLeft, lowerArmRight,
                  upperLegLeft, upperLegRight, lowerLegLeft, lowerLegRight];

    // joints
    const joints = [
        Constraint.create({ bodyA: head, pointA: {x:0,y:20}, bodyB: torso, pointB: {x:0,y:-30}, stiffness: 0.6 }),
        Constraint.create({ bodyA: upperArmLeft, pointA: {x:0,y:-20}, bodyB: torso, pointB: {x:-15,y:-20}, stiffness: 0.6 }),
        Constraint.create({ bodyA: upperArmRight, pointA: {x:0,y:-20}, bodyB: torso, pointB: {x:15,y:-20}, stiffness: 0.6 }),
        Constraint.create({ bodyA: lowerArmLeft, pointA: {x:0,y:-20}, bodyB: upperArmLeft, pointB: {x:0,y:20}, stiffness: 0.6 }),
        Constraint.create({ bodyA: lowerArmRight, pointA: {x:0,y:-20}, bodyB: upperArmRight, pointB: {x:0,y:20}, stiffness: 0.6 }),
        Constraint.create({ bodyA: upperLegLeft, pointA: {x:0,y:-25}, bodyB: torso, pointB: {x:-10,y:30}, stiffness: 0.6 }),
        Constraint.create({ bodyA: upperLegRight, pointA: {x:0,y:-25}, bodyB: torso, pointB: {x:10,y:30}, stiffness: 0.6 }),
        Constraint.create({ bodyA: lowerLegLeft, pointA: {x:0,y:-25}, bodyB: upperLegLeft, pointB: {x:0,y:25}, stiffness: 0.6 }),
        Constraint.create({ bodyA: lowerLegRight, pointA: {x:0,y:-25}, bodyB: upperLegRight, pointB: {x:0,y:25}, stiffness: 0.6 }),
    ];

    World.add(world, parts.concat(joints));
}

// initial ragdoll
createRagdoll(width/2, height/2);

// spawn weapons
function spawnBat() {
    const bat = Bodies.rectangle(Math.random() * width, 50, 120, 15, { restitution: 0.6, density: 0.004 });
    World.add(world, bat);
}
function spawnSword() {
    const sword = Bodies.rectangle(Math.random() * width, 50, 100, 10, { restitution: 0.6, density: 0.004 });
    World.add(world, sword);
}

// mobile button listeners
document.getElementById('spawnBat').addEventListener('click', spawnBat);
document.getElementById('spawnSword').addEventListener('click', spawnSword);
document.getElementById('spawnRagdoll').addEventListener('click', () => createRagdoll(width/2, height/2));

// add touch control (drag bodies)
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, {
    mouse: mouse,
    constraint: {
        stiffness: 0.2,
        render: { visible: false }
    }
});
World.add(world, mouseConstraint);
render.mouse = mouse;

// resize canvas on orientation change
window.addEventListener('resize', () => {
    Render.lookAt(render, {
        min: { x: 0, y: 0 },
        max: { x: window.innerWidth, y: window.innerHeight }
    });
});
</script>
</body>
</html>
